version: 2

# A meta repository: its issues, labels, and specs live here. The multi-Git workspace clones the
# repository of each issue into .target/, and the agent works there. An issue without a target
# label is a feature for the meta repository itself; factory target add attaches the others.
project:
  name: pulse-meta
  root: ../.target

runtime:
  provider: github
  stateBackend: labels
  workflow: build
  workspace: multigit
  onHold: skip
  onNoState: skip
  recordAuthor: github-actions

prompts:
  preamble: ../.factory/prompts/preamble.md
  variables:
    work_directory: .factory/work

providers:
  github:
    package: "@paragondata/factory-provider-github"
    options:
      repository: lorenzh/pulse-meta

stateBackends:
  labels:
    package: "@paragondata/factory-state-labels"

harnesses:
  claude:
    package: "@paragondata/factory-harness-claude"
    structuredOutput: required
    options:
      permissionMode: auto
  # The auto preset of factory docs codex (the counterpart of Claude's permissionMode auto) plus
  # network access: the review prompts require dynamic checks, so the agent installs packages,
  # runs tests and starts local servers. The login comes from CODEX_HOME (factory-run.yml).
  codex:
    package: "@paragondata/factory-harness-codex"
    structuredOutput: required
    modelDefaults:
      sandboxMode: workspace-write
      approvalPolicy: on-request
      approvalsReviewer: auto_review
      networkAccessEnabled: true
    options: {}

workspaces:
  multigit:
    package: "@paragondata/factory-workspace-multigit"
    options:
      defaultTarget: meta
      git:
        branch: factory/{issue.id}-{issue.slug}
        pullRequest:
          title: "{issue.title}"
          body: Refs lorenzh/pulse-meta#{issue.id}
          draft: true
        baseMerge:
          workflows:
            merge: agent
      targets:
        meta:
          url: https://github.com/lorenzh/pulse-meta.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-meta } }
          workflows: [ spec, audit, report, merge ]
          context: [ contract, probe, api, status, notify, config, kit, website, console, deploy ]
        contract:
          url: https://github.com/lorenzh/pulse-contract.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-contract } }
          workflows: [ build, merge ]
          context: [ meta, config ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        probe:
          url: https://github.com/lorenzh/pulse-probe.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-probe } }
          workflows: [ build, merge ]
          context: [ meta, contract, config, kit ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        api:
          url: https://github.com/lorenzh/pulse-api.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-api } }
          workflows: [ build, merge ]
          context: [ meta, contract, config, kit ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        status:
          url: https://github.com/lorenzh/pulse-status.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-status } }
          workflows: [ build, merge ]
          context: [ meta, contract, api, config, kit ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        notify:
          url: https://github.com/lorenzh/pulse-notify.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-notify } }
          workflows: [ build, merge ]
          context: [ meta, contract, api, config, kit ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        config:
          url: https://github.com/lorenzh/pulse-config.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-config } }
          workflows: [ build, merge ]
          context: [ meta ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        kit:
          url: https://github.com/lorenzh/pulse-kit.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-kit } }
          workflows: [ build, merge ]
          context: [ meta, config ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        website:
          url: https://github.com/lorenzh/pulse-website.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-website } }
          workflows: [ build, merge ]
          context: [ meta, config, contract, api, probe, status, notify, kit, console, deploy ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        console:
          url: https://github.com/lorenzh/pulse-console.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-console } }
          workflows: [ build, merge ]
          context: [ meta, contract, api, config, kit ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }
        deploy:
          url: https://github.com/lorenzh/pulse-deploy.git
          provider: { package: "@paragondata/factory-provider-github", options: { repository: lorenzh/pulse-deploy } }
          workflows: [ build, merge ]
          context: [ meta, api, probe, status, notify, console, config ]
          exclude: [ /.factory/ ]
          pullRequest: { body: "Closes lorenzh/pulse-meta#{issue.id}" }

# One profile per role. Writers (planner, implementer, resolver, auditor) run on Claude, reviewers
# on Codex, so every review comes from the other model family. Effort follows the work: specs and
# reviews decide what ships and run at high; implementation follows an approved spec and runs at
# low; a merge conflict is mechanical. review.md and security.md frame the reviewers adversarially.
models:
  spec-reviewer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: high
  planner:
    harness: claude
    options:
      model: claude-opus-5-5
      effort: high
  # Writes the task list of each repository section after the plan.
  # Owner decision: the task breakdown runs on GPT. plan-review (also GPT) then reviews it from the
  # same family; factory-tasks.mjs --check and the task-review of every task are the cross-checks.
  breakdown-writer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: high
  plan-reviewer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: high
  implementer:
    harness: claude
    options:
      model: claude-opus-5-5
      effort: low
  code-reviewer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: high
  # Reviews one task of a child before the next task starts.
  task-reviewer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: high
  security-reviewer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: high
  # The merge pair is swapped against the build pair: GPT resolves, Claude reviews, so the
  # reviewer stays in the other family.
  resolver:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: medium
  merge-reviewer:
    harness: claude
    options:
      model: claude-opus-5-5
      effort: medium
  # Owner decision: both audit states run at effort xhigh; an audit reads whole repositories, not
  # one diff.
  auditor:
    harness: claude
    # An audit reads whole repositories and may run the bench; the default deadline of 60 minutes
    # stopped the first performance audit (#503). The prompts budget their work to fit 120 minutes.
    timeoutMs: 7200000
    options:
      model: claude-opus-5-5
      effort: xhigh

  # audit-review reproduces the auditor's findings from the other family.
  audit-reviewer:
    harness: codex
    timeoutMs: 7200000
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: xhigh

  # Factory report (owner decision): Claude writes the text at high effort, Codex reviews it at
  # medium. Both read one data.json; neither builds or runs the targets.
  reporter:
    harness: claude
    options:
      model: claude-opus-5-5
      effort: high
  report-reviewer:
    harness: codex
    options:
      model: gpt-6.1-sol
      modelReasoningEffort: medium

statuses:
  needs-input:
    source: agent
    description: The agent needs a decision from a person.

workflows:
  spec:
    initial: issue-review
    states:
      issue-review:
        prompt: ../.factory/prompts/issue-review.md
        model: spec-reviewer
        transitions:
          - to: plan
        description: Check the feature request for gaps before specifying it.
      plan:
        prompt: ../.factory/prompts/plan.md
        model: planner
        transitions:
          - to: breakdown
        description: Write the cross-repository spec with one section per repository.
      breakdown:
        prompt: ../.factory/prompts/breakdown.md
        model: breakdown-writer
        transitions:
          - to: plan-review
        description: Cut each repository section into 1 to 8 tasks in tasks/<target>.json.
      plan-review:
        prompt: ../.factory/prompts/plan-review.md
        model: plan-reviewer
        transitions:
          - to: plan
          - to: breakdown
        terminal: true
        description: Review the spec; merging its pull request approves it.
  build:
    initial: implement
    states:
      implement:
        prompt: ../.factory/prompts/implement.md
        model: implementer
        # scripts/factory-tasks.mjs names the task: a step task goes to task-review; the final task,
        # a fix after review or security, and a spec without a task list go to review.
        transitions:
          - to: task-review
          - to: review
        description: Implement the next task of this repository's section of the approved spec.
      task-review:
        prompt: ../.factory/prompts/task-review.md
        model: task-reviewer
        transitions:
          - to: implement
        description: Accept or reject the newest task in a fresh agent session.
      # Factory has no conditional transitions: the reviewer picks `security` instead of `complete`
      # when the spec says "Security impact: yes".
      review:
        prompt: ../.factory/prompts/review.md
        model: code-reviewer
        transitions:
          - to: implement
          - to: security
        terminal: true
        description: Review the change in a fresh agent session.
      security:
        prompt: ../.factory/prompts/security.md
        model: security-reviewer
        transitions:
          - to: implement
        terminal: true
        description: Attack the change with hostile inputs when the spec flags a security impact.
  # Audits of main on the meta target: the report pull request is the result, and merging it
  # accepts the report. No gates; the owner turns findings into issues after the merge.
  audit:
    initial: audit
    states:
      audit:
        prompt: ../.factory/prompts/audit.md
        model: auditor
        transitions:
          - to: audit-review
        description: Audit main of the named repositories and write the report under audits/.
      audit-review:
        prompt: ../.factory/prompts/audit-review.md
        model: audit-reviewer
        transitions:
          - to: audit
        terminal: true
        description: Reproduce every P1 and P2 finding and drop what the evidence does not prove.
  # The Factory report on the meta target: report/data.json comes from factory-report-open.yml, the
  # agent writes only report/narrative.json, and merging the pull request publishes the page.
  report:
    initial: report
    states:
      report:
        prompt: ../.factory/prompts/report.md
        model: reporter
        transitions:
          - to: report-review
        description: Commit the opener's data.json unchanged and write the report text in narrative.json.
      report-review:
        prompt: ../.factory/prompts/report-review.md
        model: report-reviewer
        transitions:
          - to: report
        terminal: true
        description: Run report/check.mjs and check every claim of the text against data.json.
  merge:
    interrupt: true
    initial: resolve
    states:
      resolve:
        prompt: ../.factory/prompts/merge-resolve.md
        model: resolver
        transitions:
          - to: review
        description: Merge the captured base commit and resolve conflicts on the issue branch.
      review:
        prompt: ../.factory/prompts/merge-review.md
        model: merge-reviewer
        transitions:
          - to: resolve
        terminal: true
        description: Verify the resolution and return to the interrupted workflow.
