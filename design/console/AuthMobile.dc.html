<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in on a phone · pulse Console</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/losoft-app/tokens.css">
<link rel="stylesheet" href="ds/losoft-app/components/bundle.css">
<link rel="stylesheet" href="console.css">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="pc" data-theme="{{theme}}" data-density="compact" style="min-height: 0;">
<div class="mb">
<div class="mb-top" style="border-bottom: 0;">
<a class="brand" href="AuthMobile.dc.html" aria-label="pulse home" style="padding: 0;"><img src="/_blob/fbf04a1dad658b8e52c66476899e4bf8" alt="" width="28" height="28"><span class="wm">pulse</span><span class="wm-cur" aria-hidden="true"></span></a>
<button type="button" class="la-iconbtn" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="margin-left: auto;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
</div>
<main class="mb-body" style="padding: 8px 16px 24px; gap: 18px;">
<div class="la-seg cs-seg-full" role="group" aria-label="Sign in or create an account">
<button type="button" class="la-seg__item" aria-pressed="{{inPressed}}" onClick="{{pickIn}}">Sign in</button>
<button type="button" class="la-seg__item" aria-pressed="{{upPressed}}" onClick="{{pickUp}}">Create account</button>
</div>
<div class="stack-8">
<h1 class="mb-title">{{heading}}</h1>
<p class="lead" style="margin: 0; font-size: var(--fs-small);">{{intro}}</p>
</div>
<div class="stack-8">
<sc-if value="{{isIn}}" hint-placeholder-val="{{true}}">
<button type="button" class="la-btn la-btn--primary" style="width: 100%;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg>Sign in with a passkey</button>
</sc-if>
<button type="button" class="la-btn la-btn--secondary" style="width: 100%;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>{{githubLabel}}</button>
</div>
<div style="display: flex; align-items: center; gap: 12px;" aria-hidden="true"><span style="flex: 1; height: 1px; background: var(--rule);"></span><span class="eb">or with email</span><span style="flex: 1; height: 1px; background: var(--rule);"></span></div>
<form class="stack" onSubmit="{{noop}}" style="gap: 14px;">
<sc-if value="{{isUp}}" hint-placeholder-val="{{false}}">
<div class="la-field"><label class="la-field__label" for="m-name">Your name</label><input class="la-input" id="m-name" autocomplete="name" placeholder="Your full name"></div>
</sc-if>
<div class="la-field"><label class="la-field__label" for="m-email">Work email</label><input class="la-input" id="m-email" type="email" autocomplete="email" value="mara@quillbird.example"></div>
<div class="la-field">
<label class="la-field__label" for="m-pw">Password</label>
<input class="la-input" id="m-pw" type="password" autocomplete="{{pwAuto}}" value="correct-horse-battery">
<sc-if value="{{isIn}}" hint-placeholder-val="{{true}}"><a href="#reset" style="font-size: var(--fs-small); align-self: flex-start; min-height: 32px; display: inline-flex; align-items: center;">Forgot password?</a></sc-if>
<sc-if value="{{isUp}}" hint-placeholder-val="{{false}}"><p class="la-field__help">At least 12 characters.</p></sc-if>
</div>
<button type="submit" class="la-btn la-btn--secondary" style="width: 100%;">{{submitLabel}}</button>
</form>
<p class="lbl" style="margin: auto 0 0;">Owners confirm sign-in with an authenticator code. <a href="#privacy">Privacy</a> · <a href="#imprint">Imprint</a></p>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"mode":{"editor":"enum","options":["signin","signup"],"default":"signin"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: null, mode: null }; }
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'light';
    const isDark = theme === 'dark';
    const mode = this.state.mode ?? this.props.mode ?? 'signin';
    const isIn = mode === 'signin';
    return {
      theme,
      themeLabel: isDark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => this.setState({ theme: isDark ? 'light' : 'dark' }),
      isIn, isUp: !isIn,
      inPressed: isIn ? 'true' : 'false',
      upPressed: isIn ? 'false' : 'true',
      pickIn: () => this.setState({ mode: 'signin' }),
      pickUp: () => this.setState({ mode: 'signup' }),
      heading: isIn ? 'Sign in to pulse' : 'Create your account',
      intro: isIn ? 'Use the passkey on this phone, GitHub or your email.' : 'Start with a trial of 14 days. No card needed.',
      githubLabel: isIn ? 'Sign in with GitHub' : 'Sign up with GitHub',
      submitLabel: isIn ? 'Sign in with email' : 'Create account',
      pwAuto: isIn ? 'current-password' : 'new-password',
      noop: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
