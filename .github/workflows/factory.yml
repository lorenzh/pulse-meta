name: Paragon Factory

on:
  issues:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  admit:
    if: ${{ startsWith(github.event.label.name, 'factory/') && github.event.sender.login != vars.FACTORY_GITHUB_ACTOR && github.event.sender.login != 'lorenzh-factory-bot' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
    steps:
      - name: Create the Factory App token
        if: ${{ vars.FACTORY_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: lorenzh
          repositories: |
            pulse-meta
            pulse-contract
            pulse-probe
            pulse-api
            pulse-status
            pulse-notify
            pulse-config
            pulse-kit
            pulse-website
            pulse-console
            pulse-deploy

      - name: Start a factory run
        env:
          GH_TOKEN: ${{ vars.FACTORY_APP_ID == '' && secrets.FACTORY_GITHUB_TOKEN || steps.app-token.outputs.token }}
          FACTORY_GITHUB_ACTOR: ${{ vars.FACTORY_GITHUB_ACTOR }}
          FACTORY_SENDER: ${{ github.event.sender.login }}
          FACTORY_ACTION: ${{ github.event.action }}
          FACTORY_LABEL: ${{ github.event.label.name }}
          FACTORY_ISSUE: ${{ github.event.issue.number }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ -n "$FACTORY_GITHUB_ACTOR" ]] || { echo "::error::Set the repository variable FACTORY_GITHUB_ACTOR to the login of the Factory bot account." >&2; exit 1; }
          if [[ "$FACTORY_SENDER" == "$FACTORY_GITHUB_ACTOR" || "$FACTORY_SENDER" == lorenzh-factory-bot ]]; then echo "Ignoring an event of the Factory bot."; exit 0; fi
          [[ -n "$GH_TOKEN" ]] || { echo "::error::Configure FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY, or the fallback FACTORY_GITHUB_TOKEN." >&2; exit 1; }
          state='^factory/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$'
          status='^factory/[a-z0-9][a-z0-9-]*/status/[a-z0-9][a-z0-9-]*$'
          admit=false
          if [[ "$FACTORY_ACTION" == labeled && "$FACTORY_LABEL" =~ $state ]]; then admit=true; fi
          if [[ "$FACTORY_ACTION" == unlabeled && "$FACTORY_LABEL" =~ $status ]]; then admit=true; fi
          [[ "$admit" == true ]] || { echo "Not a factory state label added or status label removed: $FACTORY_LABEL"; exit 0; }
          [[ "$FACTORY_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "Not a canonical issue number: $FACTORY_ISSUE" >&2; exit 1; }
          gh workflow run factory-run.yml --repo "$GITHUB_REPOSITORY" --ref "$FACTORY_DEFAULT_BRANCH" \
            -f issue="$FACTORY_ISSUE" -f admission=label

      # A failure before the claim leaves no Factory comment. Say so on the issue, with the failed
      # step and the command that starts it again. Only the run URL and step name are printed.
      - name: Report the failure on the issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="${{ github.event.issue.number }}"
          [[ "$issue" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "No issue to report on."; exit 0; }
          step="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name][0] // "unknown"')" || step=unknown
          body="Factory: job \`$GITHUB_JOB\` of [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) failed in step \`$step\`.

          Check the log and fix the cause. Then start it again:

          \`\`\`sh
          gh workflow run factory-run.yml --repo $GITHUB_REPOSITORY -f issue=$issue -f admission=restart
          \`\`\`

          <!-- pulse-factory-alert -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="$body" > /dev/null
