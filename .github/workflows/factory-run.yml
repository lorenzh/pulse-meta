name: Paragon Factory run
# The sweeper (factory-sweep.yml) finds the active run of an issue by this title.
run-name: "Factory run #${{ inputs.issue }} ${{ inputs.admission }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      admission:
        description: restart continues the issue now; cancel ends its interruption; label and continuation are sent by the runner
        required: true
        default: restart
        type: choice
        options: [restart, label, continuation, cancel]
      generation:
        description: Record generation, for continuation only
        required: false
        default: ""
        type: string

concurrency:
  group: factory-issue-${{ inputs.issue }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  run-state:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    env:
      FACTORY_ISSUE: ${{ inputs.issue }}
      FACTORY_ADMISSION: ${{ inputs.admission }}
      FACTORY_GENERATION: ${{ inputs.generation }}
      FACTORY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FACTORY_GITHUB_ACTOR: ${{ vars.FACTORY_GITHUB_ACTOR }}
    outputs:
      continue: ${{ steps.run.outputs.continue }}
      generation: ${{ steps.run.outputs.generation }}
    steps:
      - name: Check the dispatch inputs
        run: |
          [[ "$FACTORY_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "Not a canonical issue number: $FACTORY_ISSUE" >&2; exit 1; }
          [[ -z "$FACTORY_GENERATION" || "$FACTORY_GENERATION" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "Not a canonical generation: $FACTORY_GENERATION" >&2; exit 1; }

      # The native harnesses codex and claude run the agent inside bubblewrap. A hosted runner has
      # no bubblewrap, and Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      # These steps install the package where it is missing and load a profile that lets only
      # /usr/bin/bwrap create such namespaces; the restriction stays on for every other program. The
      # profile is loaded only where bwrap fails without it. The last command is the containment
      # command of Factory, so a runner that cannot supply it fails here, before any project code or
      # agent runs.
      - name: Install bubblewrap
        run: |
          command -v bwrap > /dev/null && exit 0
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Allow user namespaces for bwrap
        run: |
          if ! bwrap --die-with-parent --unshare-pid --bind / / --proc /proc --dev-bind /dev /dev -- true 2>/dev/null; then
            sudo tee /etc/apparmor.d/factory-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile factory-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/factory-bwrap
          fi
          bwrap --die-with-parent --unshare-pid --bind / / --proc /proc --dev-bind /dev /dev -- true

      - name: Check the bot account
        env:
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          [[ -n "$FACTORY_GITHUB_ACTOR" ]] || { echo "::error::Set the repository variable FACTORY_GITHUB_ACTOR to the login of the Factory bot account." >&2; exit 1; }
          [[ -n "$FACTORY_GITHUB_TOKEN" ]] || { echo "::error::Set the repository secret FACTORY_GITHUB_TOKEN to a personal access token of the Factory bot account." >&2; exit 1; }
          login="$(GH_TOKEN="$FACTORY_GITHUB_TOKEN" gh api user --jq .login)" || { echo "::error::Cannot read the account of the secret FACTORY_GITHUB_TOKEN." >&2; exit 1; }
          # The runner record compares authors exactly, so the logins must match, case included.
          [[ "$login" == "$FACTORY_GITHUB_ACTOR" ]] || { echo "::error::The secret FACTORY_GITHUB_TOKEN belongs to $login, but the repository variable FACTORY_GITHUB_ACTOR is $FACTORY_GITHUB_ACTOR." >&2; exit 1; }

      # Git gets the bot token only through GIT_ASKPASS, on the steps that run Factory. The helper
      # prints the GH_TOKEN of the calling process and stores nothing, so no git config and no gh
      # file holds a credential, and the checkout keeps none. The agent still inherits GH_TOKEN
      # from the run step: see docs/factory.md, "Prompt injection and credentials".
      - name: Write the Git askpass helper
        run: |
          cat > "$RUNNER_TEMP/factory-git-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            Username*) printf '%s\n' x-access-token ;;
            Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          ASKPASS
          chmod 0755 "$RUNNER_TEMP/factory-git-askpass"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # A job image with exactly the pinned Node and its npm needs no download.
      - name: Check the preinstalled Node
        id: node
        run: |
          if [[ "$(node --version 2>/dev/null)" == v24.19.0 ]] && command -v npm > /dev/null; then echo "preinstalled=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ steps.node.outputs.preinstalled != 'true' }}
        with:
          node-version: 24.19.0
          package-manager-cache: false

      # Bun targets run their git hooks (lefthook) with bun/bunx when the Factory commits.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install factory packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.FACTORY_PACKAGES_TOKEN }}
        run: npm ci

      # Claude Code defaults to the version of the green runs on 2026-10-30 when the variable is
      # unset; the variable is `latest` by owner decision. Codex defaults to `skip`; the review
      # profiles need it, so the repository variable pins it. A repository variable overrides either default with an exact
      # MAJOR.MINOR.PATCH, `latest` or `skip`; anything else (a range, another tag) fails here.
      - name: Install agent CLIs
        env:
          FACTORY_CODEX_VERSION: ${{ vars.FACTORY_CODEX_VERSION || 'skip' }}
          FACTORY_CLAUDE_VERSION: ${{ vars.FACTORY_CLAUDE_VERSION || '2.1.314' }}
        run: |
          exact='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for name in FACTORY_CODEX_VERSION FACTORY_CLAUDE_VERSION; do
            value="${!name}"
            [[ "$value" == skip || "$value" == latest || "$value" =~ $exact ]] || { echo "::error::$name must be an exact MAJOR.MINOR.PATCH version, latest or skip, not '$value'." >&2; exit 1; }
          done
          if [ "$FACTORY_CODEX_VERSION" != skip ]; then
            npm install --global --no-audit --no-fund "@openai/codex@$FACTORY_CODEX_VERSION"
            # The Codex SDK splits its JSONL input with Node readline, which also ends lines at raw
            # U+2028/U+2029 (openai/codex#45727, paragondata/factory#320). This wrapper escapes both
            # in the CLI's stdout; the JSON keeps its meaning. Remove it once the SDK reads by \n only.
            real="$(command -v codex)"
            mkdir -p "$RUNNER_TEMP/codex-shim"
            printf '%s\n' '#!/usr/bin/env bash' 'set -o pipefail' \
              "\"$real\" \"\$@\" | perl -CS -pe 'BEGIN { \$| = 1 } s/\x{2028}/\\\\u2028/g; s/\x{2029}/\\\\u2029/g'" \
              > "$RUNNER_TEMP/codex-shim/codex"
            chmod 0755 "$RUNNER_TEMP/codex-shim/codex"
            echo "$RUNNER_TEMP/codex-shim" >> "$GITHUB_PATH"
          fi
          if [ "$FACTORY_CLAUDE_VERSION" != skip ]; then
            npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$FACTORY_CLAUDE_VERSION"
          fi

      - name: Check the CLI minor line
        env:
          FACTORY_CLI_MINOR: "0.8"
        run: |
          installed="$(node ./node_modules/@paragondata/factory-cli/dist/bin.js --version)"
          if [[ "${installed%.*}" != "$FACTORY_CLI_MINOR" || ! "${installed##*.}" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "Expected @paragondata/factory-cli $FACTORY_CLI_MINOR.x, installed ${installed:-nothing}. A new minor release needs an explicit upgrade; see factory docs runners." >&2
            exit 1
          fi
          echo "Using @paragondata/factory-cli $installed."

      - name: Configure Git author
        run: |
          git config --global user.name "paragon-factory[bot]"
          git config --global user.email "paragon-factory[bot]@users.noreply.github.com"

      # A cancel ends the active interruption through resume. It writes the runner record as the
      # same author as every run, and it continues nothing: the run step and its outputs stay empty.
      - name: Cancel the interruption
        if: ${{ inputs.admission == 'cancel' }}
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GIT_ASKPASS: ${{ runner.temp }}/factory-git-askpass
        run: >-
          node ./node_modules/@paragondata/factory-cli/dist/bin.js resume
          --issue "$FACTORY_ISSUE" --cancel-interruption --apply
          --run-id "$FACTORY_RUN_ID" --record-author "$FACTORY_GITHUB_ACTOR"

      # Stopgap until the self-hosted runner arrives: Codex refreshes this subscription login after ~8 days, and then the secret stops working.
      - name: Write the Codex login
        if: ${{ inputs.admission != 'cancel' }}
        env:
          FACTORY_CODEX_AUTH_JSON: ${{ secrets.FACTORY_CODEX_AUTH_JSON }}
        run: |
          [[ -n "$FACTORY_CODEX_AUTH_JSON" ]] || echo "::warning::The repository secret FACTORY_CODEX_AUTH_JSON is empty; the Codex review states will fail to log in."
          umask 077
          mkdir -p "$RUNNER_TEMP/codex"
          printf '%s' "$FACTORY_CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex/auth.json"
          chmod 0600 "$RUNNER_TEMP/codex/auth.json"

      - name: Run one factory state
        if: ${{ inputs.admission != 'cancel' }}
        id: run
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GIT_ASKPASS: ${{ runner.temp }}/factory-git-askpass
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FACTORY_CLAUDE_OAUTH_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/codex
          # Factory commits leftover agent work when it publishes, also on a hold. A failing lefthook
          # pre-commit then ends the run with COMMAND_FAILED and loses the hold (#603). CI runs the checks.
          LEFTHOOK: "0"
        # stderr also goes to a file: the next step reads the error code from it. A task loop runs two
        # states per task (implement, task-review), so the chain limit allows 8 tasks and some repairs.
        run: >-
          node ./node_modules/@paragondata/factory-cli/dist/bin.js run
          --issue "$FACTORY_ISSUE" --detect-workflow --workspace multigit --apply
          --runner-admission "$FACTORY_ADMISSION"
          ${FACTORY_GENERATION:+--generation "$FACTORY_GENERATION"}
          --run-id "$FACTORY_RUN_ID" --record-author "$FACTORY_GITHUB_ACTOR" --chain-limit 24
          --continue-output "$GITHUB_OUTPUT"
          2> >(tee "$RUNNER_TEMP/factory-run.err" >&2)

      # A HARNESS_TIMEOUT restarts the issue once by itself (.github/run/auto-restart.sh). A second
      # timeout of the same state before a run of it finishes gets the failure comment below.
      - name: Restart once after a harness timeout
        id: restart
        if: ${{ failure() && inputs.admission != 'cancel' }}
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          FACTORY_RUN_ERR: ${{ runner.temp }}/factory-run.err
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/run/auto-restart.sh

      # A failure before the claim leaves no Factory comment. Say so on the issue, with the failed
      # step and the command that starts it again. Only the run URL and step name are printed.
      - name: Report the failure on the issue
        if: ${{ failure() && steps.restart.outputs.restarted != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$FACTORY_ISSUE"
          [[ "$issue" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "No issue to report on."; exit 0; }
          step="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name][0] // "unknown"')" || step=unknown
          body="Factory: job \`$GITHUB_JOB\` of [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) failed in step \`$step\`.

          Check the log and fix the cause. Then start it again:

          \`\`\`sh
          gh workflow run factory-run.yml --repo $GITHUB_REPOSITORY -f issue=$issue -f admission=restart
          \`\`\`

          <!-- pulse-factory-alert -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="$body" > /dev/null

  continue:
    needs: run-state
    if: ${{ needs.run-state.outputs.continue == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
    env:
      FACTORY_ISSUE: ${{ inputs.issue }}
      FACTORY_GENERATION: ${{ needs.run-state.outputs.generation }}
      FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          [[ "$FACTORY_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "Not a canonical issue number: $FACTORY_ISSUE" >&2; exit 1; }
          [[ "$FACTORY_GENERATION" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "Not a canonical generation: $FACTORY_GENERATION" >&2; exit 1; }
          gh workflow run factory-run.yml --repo "$GITHUB_REPOSITORY" --ref "$FACTORY_DEFAULT_BRANCH" \
            -f issue="$FACTORY_ISSUE" -f admission=continuation -f generation="$FACTORY_GENERATION"

      # A failure before the claim leaves no Factory comment. Say so on the issue, with the failed
      # step and the command that starts it again. Only the run URL and step name are printed.
      - name: Report the failure on the issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$FACTORY_ISSUE"
          [[ "$issue" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "No issue to report on."; exit 0; }
          step="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name][0] // "unknown"')" || step=unknown
          body="Factory: job \`$GITHUB_JOB\` of [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) failed in step \`$step\`.

          Check the log and fix the cause. Then start it again:

          \`\`\`sh
          gh workflow run factory-run.yml --repo $GITHUB_REPOSITORY -f issue=$issue -f admission=continuation -f generation=$FACTORY_GENERATION
          \`\`\`

          <!-- pulse-factory-alert -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="$body" > /dev/null
