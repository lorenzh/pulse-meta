name: Runner pick

# Reusable: answers `runs-on` for the calling job. Prefers the self-hosted runners of this repository
# and falls back to a GitHub-hosted runner. GITHUB_TOKEN cannot list runners, so a heartbeat on the
# runner host (scripts/runner-heartbeat.sh) publishes the count of idle online runners and its time
# in the variables RUNNERS_IDLE and RUNNERS_BEAT. A missing, stale or zero heartbeat means hosted.
# Set the variable RUNNERS_FORCE to `hosted` to switch the self-hosted runners off by hand.
on:
  workflow_call:
    outputs:
      runs-on:
        description: JSON for runs-on
        value: ${{ jobs.pick.outputs.runs-on }}

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: pick
        env:
          IDLE: ${{ vars.RUNNERS_IDLE }}
          BEAT: ${{ vars.RUNNERS_BEAT }}
          FORCE: ${{ vars.RUNNERS_FORCE }}
        run: |
          pick='"ubuntu-24.04"'
          if [[ "$FORCE" != hosted && "$IDLE" =~ ^[1-9][0-9]*$ && "$BEAT" =~ ^[0-9]+$ ]] && (( $(date +%s) - BEAT < 180 )); then
            pick='["self-hosted","pulse-meta","bwrap"]'
          fi
          echo "runs-on=$pick" | tee -a "$GITHUB_OUTPUT"
