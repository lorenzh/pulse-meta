name: Factory report

# Publishes the merged Factory report on GitHub Pages: report/index.html with the committed
# report/data.json and report/narrative.json. It fetches no live data; the report workflow writes
# both files and a merge publishes them. After a push to main it closes the report issue that
# narrative.json names, so the next opener (factory-report-open.yml) is not blocked.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - '.github/workflows/factory-report.yml'

concurrency:
  group: factory-report
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Check and stage the report
        run: |
          node report/check.mjs
          mkdir _site
          cp report/index.html report/data.json report/narrative.json _site/

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  close-issue:
    needs: deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            report
            .github/report

      - name: Close the report issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_URL: ${{ needs.deploy.outputs.page_url }}
        run: .github/report/close-issue.sh
